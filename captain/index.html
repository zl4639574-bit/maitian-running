<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>麦田守望长跑队 · 队长版</title>
<link rel="icon" href="../images/logo.jpg">
<link rel="stylesheet" href="../assets/style.css?v=4">
</head>
<body>

<div class="nav" id="nav"></div>
<div class="wrap" id="page"></div>
<div class="toast" id="toast"></div>

<script>
/* 队长版：批量导入、比赛成绩管理、照片上传、队伍信息修改、一键同步到线上 */
window.APP_MODE = 'captain';
window.APP_ROOT = '../';
(function () {
  var R = window.APP_ROOT;
  var files = [R + 'assets/xlsx.full.min.js', R + 'data/team-data.js', R + 'images/photos.js'];
  var n = 0;
  function boot() {
    var a = document.createElement('script');
    a.src = R + 'assets/app.js?t=' + Date.now();
    document.head.appendChild(a);
  }
  files.forEach(function (f) {
    var s = document.createElement('script');
    s.src = f + '?t=' + Date.now();
    s.onload = s.onerror = function () { if (++n === files.length) boot(); };
    document.head.appendChild(s);
  });
})();
</script>
</body>
</html>
