name: 合并队员直传的成绩

on:
  schedule:
    - cron: '*/10 * * * *'      # 每 10 分钟检查一次
  workflow_dispatch:            # 也可以手动点一下立即合并

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取收集仓库里的新提交并合并
        run: python3 scripts/merge_queue.py

      - name: 提交更新
        run: |
          git config user.name "麦田守望机器人"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "自动合并队员直传的成绩 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
