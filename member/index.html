<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>麦田守望长跑队 · 队员版</title>
<link rel="icon" href="../images/logo.jpg">
<link rel="stylesheet" href="../assets/style.css?v=4">
</head>
<body>

<div class="nav" id="nav"></div>
<div class="wrap" id="page"></div>
<div class="toast" id="toast"></div>

<script>
/* 队员版：可以录自己的成绩（半马/全马都能录），不能改队伍数据 */
window.APP_MODE = 'member';
window.APP_ROOT = '../';
(function () {
  var R = window.APP_ROOT;
  var files = [R + 'data/team-data.js', R + 'images/photos.js'];
  var n = 0;
  function boot() {
    var a = document.createElement('script');
    a.src = R + 'assets/app.js?t=' + Date.now();
    document.head.appendChild(a);
  }
  files.forEach(function (f) {
    var s = document.createElement('script');
    s.src = f + '?t=' + Date.now();
    s.onload = s.onerror = function () { if (++n === files.length) boot(); };
    document.head.appendChild(s);
  });
})();
</script>
</body>
</html>
